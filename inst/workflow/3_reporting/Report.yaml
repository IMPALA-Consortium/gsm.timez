meta:
  Type: Reporting
  ID: Report
  Description: Generate HTML report from flagged timeline data

spec:
  Analysis_Flag:
    GroupID:
      type: character
    GroupLevel:
      type: character
    NMonth:
      type: integer
    DenominatorMonth:
      type: Date
    Numerator:
      type: numeric
    Denominator:
      type: numeric
    Metric:
      type: numeric
    Score:
      type: numeric
    Flag:
      type: numeric

steps:
  - output: Reporting_Charts
    name: gsm.timez::MakeCharts_Timeline
    params:
      dfFlagged: Analysis_Flag

  - output: Reporting_Report
    name: gsm.timez::Report_Timeline
    params:
      dfFlagged: Analysis_Flag
      lCharts: Reporting_Charts
