meta:
  Type: Analysis
  ID: kri_timez_funnel
  Name: Cumulative AE Timeline (Funnel)
  Description: Site-level cumulative adverse event timeline with funnel-based z-score flagging
  Status: Pilot
  GroupLevel: Site
  Abbreviation: TIMEZF
  Metric: Cumulative AE Rate Over Time
  Numerator: Cumulative Adverse Events
  Denominator: Cumulative Visits
  AnalysisType: cumulative rate
  Model: Funnel Z-Score
  Score: Z-Score
  Threshold: "-1.5,-1,2,3"

spec:
  Mapped_SUBJ:
    subjid:
      type: character
    invid:
      type: character
  Mapped_AE:
    subjid:
      type: character
    aest_dt:
      type: Date
  Mapped_VISIT:
    subjid:
      type: character
    visit_dt:
      type: Date

steps:
  - output: vThreshold
    name: gsm.core::ParseThreshold
    params:
      strThreshold: Threshold

  - output: Analysis_Timeline
    name: gsm.timez::Timeline
    params:
      dfSubjects: Mapped_SUBJ
      dfNumerator: Mapped_AE
      dfDenominator: Mapped_VISIT
      strGroupCol: invid
      strSubjectCol: subjid
      strNumeratorDateCol: aest_dt
      strDenominatorDateCol: visit_dt

  - output: Analysis_Analyzed
    name: gsm.timez::TimeZScoreFunnel
    params:
      dfTimeline: Analysis_Timeline

  - output: Analysis_Flagged
    name: gsm.timez::Flag
    params:
      dfAnalyzed: Analysis_Analyzed
      vThreshold: vThreshold

  - output: Analysis_Bounds
    name: gsm.timez::TimeZScoreFunnel_PredictBounds
    params:
      dfAnalyzed: Analysis_Analyzed
      vThreshold: vThreshold

  - output: lAnalysis
    name: list
    params:
      ID: ID
      Flagged: Analysis_Flagged
      Bounds: Analysis_Bounds
