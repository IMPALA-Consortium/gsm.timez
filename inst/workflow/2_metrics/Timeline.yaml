meta:
  Type: Analysis
  ID: timeline
  GroupLevel: Site
  Metric: Cumulative Event Timeline
  Numerator: Events (e.g., Adverse Events)
  Denominator: Time Points (e.g., Visits)
  Description: Generate subject-level timeline of cumulative events over time

spec:
  Mapped_SUBJ:
    studyid:
      type: character
    subjid:
      type: character
    invid:
      type: character
  Mapped_AE:
    studyid:
      type: character
    subjid:
      type: character
    aest_dt:
      type: Date
  Mapped_VISIT:
    studyid:
      type: character
    subjid:
      type: character
    visit_dt:
      type: Date

steps:
  - output: Timeline_Output
    name: gsm.timez::Timeline
    params:
      dfSubjects: Mapped_SUBJ
      dfNumerator: Mapped_AE
      dfDenominator: Mapped_VISIT
      strGroupCol: invid
      strStudyCol: studyid
      strSubjectCol: subjid
      strNumeratorDateCol: aest_dt
      strDenominatorDateCol: visit_dt
