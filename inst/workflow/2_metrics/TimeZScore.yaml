meta:
  Type: Analysis
  ID: TimeZScore
  GroupLevel: Site
  Metric: Z-Score by Group
  Description: Calculate z-scores for each group based on event rate

spec:
  Analysis_Timeline:
    GroupID:
      type: character
    GroupLevel:
      type: character
    Numerator:
      type: integer
    Denominator:
      type: integer
    DenominatorMonth:
      type: Date
    NMonth:
      type: integer

steps:
  - output: Analysis_TimeZScore
    name: gsm.timez::TimeZScore
    params:
      dfTimeline: Analysis_Timeline
