meta:
  Type: Module
  ID: TimelineFunnelCustom
  Description: Generate timeline KRI HTML report with funnel-based visualizations using custom template

steps:
  - output: lChartsDefault
    name: gsm.kri::MakeCharts
    params:
      dfResults: Reporting_Results
      dfMetrics: Reporting_Metrics
      dfGroups: Reporting_Groups
      dfBounds: ~

  - output: lChartsVisualizeFunnel
    name: gsm.timez::Widget
    params:
      dfResults: Reporting_Results_allmonths
      strVisualizeFun: "gsm.timez::VisualizeFunnel"
      strOutputLabel: "Funnel Heatmap"
      strIcon: "th"
      bInteractive: false

  - output: lChartsVisualizeFunnelPlot
    name: gsm.timez::Widget
    params:
      dfResults: Reporting_Results_allmonths
      dfBounds: Reporting_Bounds
      strVisualizeFun: "gsm.timez::VisualizeFunnelPlot"
      strOutputLabel: "Funnel Plot"
      strIcon: "bullseye"
      bInteractive: false

  - output: lChartsSite0X159
    name: gsm.timez::Widget
    params:
      dfResults: Reporting_Results_allmonths
      strVisualizeFun: "gsm.timez::VisualizeSite"
      strOutputLabel: "Site 0X159"
      strIcon: "magnifying-glass"
      strSiteID: "0X159"

  - output: lChartsSite0X153
    name: gsm.timez::Widget
    params:
      dfResults: Reporting_Results_allmonths
      strVisualizeFun: "gsm.timez::VisualizeSite"
      strOutputLabel: "Site 0X153"
      strIcon: "magnifying-glass"
      strSiteID: "0X153"

  - output: lCharts
    name: gsm.timez::MergeChartLists
    params:
      lChartsDefault: lChartsDefault
      lChartsVisualizeFunnel: lChartsVisualizeFunnel
      lChartsVisualizeFunnelPlot: lChartsVisualizeFunnelPlot
      lChartsSite0X159: lChartsSite0X159
      lChartsSite0X153: lChartsSite0X153

  - output: strReportPath
    name: gsm.timez::Report_KRI_Custom
    params:
      lCharts: lCharts
      dfResults: Reporting_Results
      dfGroups: Reporting_Groups
      dfMetrics: Reporting_Metrics
