meta:
  Type: Module
  ID: Timeline
  Description: Generate timeline KRI HTML report with default and custom charts

steps:
  - output: lChartsDefault
    name: gsm.kri::MakeCharts
    params:
      dfResults: Reporting_Results
      dfMetrics: Reporting_Metrics
      dfGroups: Reporting_Groups
      dfBounds: ~

  - output: lChartsVisualize
    name: gsm.timez::Widget
    params:
      dfResults: Reporting_Results_allmonths
      strVisualizeFun: "gsm.timez::Visualize"
      strOutputLabel: "Visualize"
      strIcon: "chart-line"

  - output: lChartsVisualizeBoxplot
    name: gsm.timez::Widget
    params:
      dfResults: Reporting_Results_allmonths
      strVisualizeFun: "gsm.timez::VisualizeBoxplot"
      strOutputLabel: "VisualizeBoxplot"
      strIcon: "chart-column"

  - output: lCharts
    name: gsm.timez::MergeChartLists
    params:
      lChartsDefault: lChartsDefault
      lChartsVisualize: lChartsVisualize
      lChartsVisualizeBoxplot: lChartsVisualizeBoxplot

  - output: strReportPath
    name: gsm.kri::Report_KRI
    params:
      lCharts: lCharts
      dfResults: Reporting_Results
      dfGroups: Reporting_Groups
      dfMetrics: Reporting_Metrics
